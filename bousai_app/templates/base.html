<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --navy: #2455a4;
      --blue: #2f67be;
      --ink: #193d78;
      --muted: #60708a;
      --line: #e7edf5;
      --page: #f6f9fc;
      --panel: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      line-height: 1.6;
    }

    .site-header {
      position: relative;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 70px;
      padding: 0 max(24px, calc((100% - 1160px) / 2));
      color: #fff;
      background: linear-gradient(110deg, #2857a5, #2d61b6);
      box-shadow: 0 2px 10px rgba(30, 66, 120, 0.16);
    }

    .site-title {
      margin: 0;
      color: #fff;
      font-size: 1.55rem;
      letter-spacing: .04em;
    }

    .menu-toggle {
      display: grid;
      width: 44px;
      height: 44px;
      padding: 10px;
      place-items: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    .menu-toggle:hover,
    .menu-toggle:focus-visible { background: rgba(255, 255, 255, .16); }

    .menu-icon,
    .menu-icon::before,
    .menu-icon::after {
      display: block;
      width: 23px;
      height: 3px;
      border-radius: 2px;
      background: #fff;
      content: "";
      transition: transform .2s ease;
    }

    .menu-icon::before { transform: translateY(-7px); }
    .menu-icon::after { transform: translateY(4px); }

    .menu-toggle[aria-expanded="true"] .menu-icon { background: transparent; }
    .menu-toggle[aria-expanded="true"] .menu-icon::before { transform: translateY(1px) rotate(45deg); }
    .menu-toggle[aria-expanded="true"] .menu-icon::after { transform: translateY(-2px) rotate(-45deg); }

    .menu-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: max(24px, calc((100% - 1160px) / 2));
      display: none;
      width: min(270px, calc(100vw - 32px));
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(30, 66, 120, .18);
    }

    .menu-panel.is-open { display: block; }

    .menu-panel a {
      display: block;
      padding: 11px 14px;
      border-radius: 6px;
      color: var(--ink);
      font-weight: 600;
      text-decoration: none;
    }

    .menu-panel a:hover,
    .menu-panel a:focus-visible { background: #edf4ff; }

    .menu-status {
      margin: 4px 14px 8px;
      color: var(--muted);
      font-size: .85rem;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 32px auto 56px;
    }

    @media (max-width: 560px) {
      .site-header { min-height: 62px; padding: 0 16px; }
      .site-title { font-size: 1.25rem; }
      .menu-panel { right: 16px; }
      main { width: min(100% - 24px, 920px); margin-top: 20px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">防災アプリ</h1>
    <button class="menu-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-menu">
      <span class="menu-icon"></span>
    </button>
    <nav id="site-menu" class="menu-panel" aria-label="メインメニュー">
      <a href="/">ホーム</a>
      <a href="/shelter_search">避難所検索</a>
      <a href="/shelter_register">避難所登録</a>
      <a href="/board">指示ボード</a>
      {% if session.logged_in %}
        <p class="menu-status">ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</p>
        <a href="/logout">ログアウト</a>
      {% else %}
        <a href="/login">ログイン</a>
      {% endif %}
    </nav>
  </header>

  <main>
    <!-- ここに子テンプレートの content が入る -->
    {% block content %}{% endblock %}
  </main>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const siteMenu = document.querySelector('#site-menu');

    menuToggle.addEventListener('click', function() {
      const isOpen = siteMenu.classList.toggle('is-open');
      menuToggle.setAttribute('aria-expanded', String(isOpen));
      menuToggle.setAttribute('aria-label', isOpen ? 'メニューを閉じる' : 'メニューを開く');
    });

    document.addEventListener('click', function(event) {
      if (!siteMenu.contains(event.target) && !menuToggle.contains(event.target)) {
        siteMenu.classList.remove('is-open');
        menuToggle.setAttribute('aria-expanded', 'false');
        menuToggle.setAttribute('aria-label', 'メニューを開く');
      }
    });
  </script>
</body>
</html>
