<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --navy: #2455a4;
      --blue: #2f67be;
      --ink: #193d78;
      --muted: #60708a;
      --line: #e7edf5;
      --page: #f6f9fc;
      --panel: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      line-height: 1.6;
    }

    .site-header {
      position: relative;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 70px;
      padding: 0 max(24px, calc((100% - 1160px) / 2));
      color: #fff;
      background: linear-gradient(110deg, #2857a5, #2d61b6);
      box-shadow: 0 2px 10px rgba(30, 66, 120, 0.16);
    }

    .site-title {
      margin: 0;
      color: #fff;
      font-size: 1.55rem;
      letter-spacing: .04em;
    }

    .home-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
    }

    .home-button:hover,
    .home-button:focus-visible { background: rgba(255, 255, 255, .16); }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 32px auto 56px;
    }

    @media (max-width: 560px) {
      .site-header { min-height: 62px; padding: 0 16px; }
      .site-title { font-size: 1.25rem; }
      .menu-panel { right: 16px; }
      main { width: min(100% - 24px, 920px); margin-top: 20px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">防災アプリ</h1>
    <a class="home-button" href="/" aria-label="ホームへ戻る" title="ホームへ戻る">ホームへ戻る</a>
  </header>

  <main>
    <!-- ここに子テンプレートの content が入る -->
    {% block content %}{% endblock %}
  </main>

</body>
</html>
